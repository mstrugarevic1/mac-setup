# ============================================================
# Kitty configuration
# Clean macOS terminal appearance with conservative defaults
# ============================================================

# Remote control can inspect and modify terminal windows, so it stays disabled.
allow_remote_control no


# ============================================================
# Font
# ============================================================

# Menlo ships with macOS and therefore also works on a completely fresh Mac.
font_family Menlo
font_size 16.0

bold_font auto
italic_font auto
bold_italic_font auto

disable_ligatures always


# ============================================================
# Window appearance and behaviour
# ============================================================

remember_window_size yes

window_padding_width 8
window_margin_width 0
placement_strategy center
# Use pane splits instead of cycling through Kitty's other window layouts.
enabled_layouts splits

hide_window_decorations no
macos_titlebar_color system

background_opacity 0.94
background_blur 16


# ============================================================
# Cursor
# ============================================================

cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.5


# ============================================================
# Hyperlinks and URLs
# ============================================================

allow_hyperlinks no
detect_urls yes
underline_hyperlinks hover
show_hyperlink_targets cmd
open_url_with default
url_style dotted


# ============================================================
# Tab bar
# ============================================================

tab_bar_edge top
tab_bar_style separator
tab_bar_align start
tab_bar_min_tabs 1

tab_bar_show_new_tab_button yes
tab_switch_strategy right

tab_separator " │ "
tab_title_template " {index}: {title} "
tab_title_max_length 30

active_tab_font_style bold
inactive_tab_font_style normal
tab_bar_background #1e1e1e
tab_bar_margin_width 0


# ============================================================
# Scrolling
# ============================================================

scrollback_lines 10000
pixel_scroll yes
scrollbar always

scrollbar_width 0.5
scrollbar_hover_width 1
scrollbar_handle_opacity 0.7
scrollbar_interactive yes


# ============================================================
# Selection and clipboard
# ============================================================

# Selection stays local until an explicit copy command.
copy_on_select no
strip_trailing_spaces smart



# ============================================================
# Sounds, alerts and notifications
# ============================================================

enable_audio_bell no
window_alert_on_bell no

# Notify only when Kitty is not visible and a command took at least 10 seconds.
notify_on_cmd_finish invisible 10


# ============================================================
# Closing behaviour
# ============================================================

# Warn before closing a window that contains a running foreground command.
confirm_os_window_close -1


# ============================================================
# macOS and shell integration
# ============================================================

macos_option_as_alt left
shell_integration no-cursor


# ============================================================
# macOS-style tab and window shortcuts
# ============================================================

# New tabs and windows inherit the current working directory.
map cmd+t new_tab_with_cwd
map cmd+n new_os_window_with_cwd
map cmd+w close_tab

map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# Open a terminal pane beside or below the current pane.
map cmd+d launch --location=vsplit
map cmd+shift+d launch --location=hsplit


# ============================================================
# Direct tab selection
# ============================================================

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9


# ============================================================
# Search and terminal controls
# ============================================================

map cmd+f search_scrollback
map cmd+k clear_terminal to_cursor active


# ============================================================
# Font-size controls
# ============================================================

map cmd+plus change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# setup.sh links this file into ~/.config/kitty, so this resolves to local.conf there.
# globinclude is optional: a missing machine-specific file is not an error.
globinclude local.conf
