# Keep tmux defaults, including the standard Ctrl-b prefix.
set -g mouse on
set -g history-limit 100000
set -g focus-events on
# Let tmux copy externally without allowing pane applications to set the system clipboard.
set -s set-clipboard external
set -sg escape-time 10
setw -g mode-keys vi

# Advertise true-colour support to applications inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and panes inherit the current directory.
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate and resize panes without the prefix.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-S-Left resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up resize-pane -U 2
bind -n M-S-Down resize-pane -D 2

# Reload the configuration with Prefix+r.
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Small status bar using the same neutral palette as Vim.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-left-length 20
set -g status-right-length 80
set -g status-style "bg=#252526,fg=#d4d4d4"
set -g status-left "#[fg=#4ec9b0,bold] #S "
set -g status-right "#[fg=#dcdcaa]🔋 #(pmset -g batt | grep -Eo '[0-9]+%%' | head -1) #[fg=#808080]%Y-%m-%d #[fg=#dcdcaa]%H:%M "
set -g window-status-separator " "
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#I:#W#F"
set -g window-status-style "fg=#808080,bg=#252526"
set -g window-status-current-style "fg=#569cd6,bg=#252526,bold"
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#dcdcaa,bg=#252526,bold"

# Make the active pane clear without adding decorations or plugins.
set -g pane-border-status off
set -g pane-border-style "fg=#808080"
set -g pane-active-border-style "fg=#569cd6"
set -g message-style "fg=#d4d4d4,bg=#252526"
set -g message-command-style "fg=#252526,bg=#dcdcaa"
set -g mode-style "fg=#252526,bg=#dcdcaa"
set -g menu-style "fg=#d4d4d4,bg=#252526"
set -g menu-selected-style "reverse"
set -g menu-border-style "fg=#808080"

# Right-click menu for common mouse-driven pane and window actions.
bind -n MouseDown3Pane display-menu -x M -y M -T "Pane" \
  "Split left/right" l "split-window -h -c '#{pane_current_path}'" \
  "Split top/bottom" b "split-window -v -c '#{pane_current_path}'" \
  "" \
  "New window" n "new-window -c '#{pane_current_path}'" \
  "Rename window" r "command-prompt -I '#W' 'rename-window -- \"%%\"'" \
  "Rename session" s "command-prompt -I '#S' 'rename-session -- \"%%\"'" \
  "" \
  "Zoom/unzoom pane" z "resize-pane -Z" \
  "Move pane to new window" w "break-pane" \
  "" \
  "Close pane" x "confirm-before -p 'Close pane? (y/n)' kill-pane"

# Load machine-specific settings when present; -q suppresses a missing-file error.
source-file -q ~/.tmux.conf.local
