# Keep tmux defaults, including the standard Ctrl-b prefix.
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi

# Advertise true-colour support to applications inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Small status bar using the same neutral palette as Vim.
set -g status-style "bg=#252526,fg=#d4d4d4"
set -g status-left "#[fg=#4ec9b0,bold] #S "
set -g status-right "#[fg=#808080]%Y-%m-%d #[fg=#dcdcaa]%H:%M "
set -g window-status-style "fg=#808080,bg=#252526"
set -g window-status-current-style "fg=#569cd6,bg=#252526,bold"

# Make the active pane clear without adding decorations or plugins.
set -g pane-border-style "fg=#808080"
set -g pane-active-border-style "fg=#569cd6"
set -g message-style "fg=#d4d4d4,bg=#252526"

# Right-click menu for common mouse-driven pane and window actions.
bind -n MouseDown3Pane display-menu -x M -y M -T "Pane" \
  "Split left/right" l "split-window -h -c '#{pane_current_path}'" \
  "Split top/bottom" b "split-window -v -c '#{pane_current_path}'" \
  "" \
  "New window" n "new-window -c '#{pane_current_path}'" \
  "Rename window" r "command-prompt -I '#W' 'rename-window -- \"%%\"'" \
  "Rename session" s "command-prompt -I '#S' 'rename-session -- \"%%\"'" \
  "" \
  "Zoom/unzoom pane" z "resize-pane -Z" \
  "Move pane to new window" w "break-pane" \
  "" \
  "Close pane" x "confirm-before -p 'Close pane? (y/n)' kill-pane"

# Load machine-specific settings when present; -q suppresses a missing-file error.
source-file -q ~/.tmux.conf.local
